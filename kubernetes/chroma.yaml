apiVersion: apps/v1
kind: Deployment

metadata:
  name: chroma
  namespace: rag

spec:
  replicas: 1

  selector:
    matchLabels:
      app: chroma

  template:
    metadata:
      labels:
        app: chroma

    spec:
      enableServiceLinks: false

      containers:
        - name: chroma
          image: chromadb/chroma:latest

          ports:
            - containerPort: 8000

          volumeMounts:
            - name: chroma-storage
              mountPath: /data

      volumes:
        - name: chroma-storage
          persistentVolumeClaim:
            claimName: chroma-data

---

apiVersion: v1
kind: Service

metadata:
  name: chroma
  namespace: rag

spec:
  selector:
    app: chroma

  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000