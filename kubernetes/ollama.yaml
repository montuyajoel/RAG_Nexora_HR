apiVersion: apps/v1
kind: Deployment

metadata:
  name: ollama
  namespace: rag

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ollama

  template:
    metadata:
      labels:
        app: ollama

    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest

          ports:
            - containerPort: 11434

          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"

            limits:
              cpu: "2000m"
              memory: "4Gi"

      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-data

---

apiVersion: v1
kind: Service

metadata:
  name: ollama
  namespace: rag

spec:
  selector:
    app: ollama

  ports:
    - protocol: TCP
      port: 11434
      targetPort: 11434