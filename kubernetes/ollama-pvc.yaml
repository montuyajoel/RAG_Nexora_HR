apiVersion: v1
kind: PersistentVolumeClaim
metadata:
 name: ollama-data
 namespace: rag
spec:
 accessModes:
 - ReadWriteOnce
 resources:
 requests:
 storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
 name: ollama
 namespace: rag
spec:
 replicas: 1
 selector:
 matchLabels:
 app: ollama
 template:
 metadata:
 labels:
 app: ollama
 spec:
 containers:
 - name: ollama
 image: ollama/ollama:latest
 ports:
 - containerPort: 11434
 volumeMounts:
 - name: data
 mountPath: /root/.ollama
 volumes:
 - name: data
 persistentVolumeClaim:
 claimName: ollama-data
---
apiVersion: v1
kind: Service
metadata:
 name: ollama
 namespace: rag
spec:
 selector:
 app: ollama
 ports:
 - port: 11434
 targetPort: 11434

kubectl apply -f kubernetes/ollama.yaml
kubectl exec -n rag deployment/ollama -- ollama pull nomic-embed-text
kubectl exec -n rag deployment/ollama -- ollama pull llama3.2:3b